<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ブラウザ仕様検証テスト（alert版）</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f0f0f0;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
        #log {
            margin-top: 30px;
            padding: 15px;
            background: #fff;
            border: 1px solid #ccc;
            display: inline-block;
            text-align: left;
            min-width: 300px;
        }
    </style>
</head>
<body>

    <h1>全画面化（Fullscreen API）仕様の検証：alert版</h1>
    <p>下のボタンを押すと alert() が出ます。OKを押した後に全画面化を要求するプログラムです。</p>
    
    <button id="alertBtn">テスト開始（alert）</button>

    <div>
        <div id="log">【コンソールログ】<br></div>
    </div>

    <script>
        const btn = document.getElementById('alertBtn');
        const logDiv = document.getElementById('log');

        function addLog(text) {
            logDiv.innerHTML += text + '<br>';
        }

        btn.addEventListener('click', () => {
            addLog('--- alertテスト開始 ---');
            
            // alertダイアログを表示（OKを押すまでここで処理が止まります）
    while (9999) {alert("うんこ。");
            
            addLog('alertダイアログが閉じられました。');

            // 全画面化を要求
            document.documentElement.requestFullscreen()
                .then(() => {
                    addLog('成功: 全画面化されました。');
                })
                .catch((error) => {
                    // confirmと同じく、alertの「OK」もユーザーの直接操作（ジェスチャー）として
                    // カウントされないため、ブラウザに弾かれます
                    addLog(`💀 ブロックされました: ${error.message}`);
                    console.error(error);
                });}
        });
    </script>

</body>
</html>
