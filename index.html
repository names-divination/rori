<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ブラウザ仕様検証テスト（無限ループ版）</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f0f0f0;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>無限ループ＋全画面化要求の検証</h1>
    <p>下のボタンを押すと、while (true) による無限アラートと全画面化要求が始まります。</p>
    <p>現代のブラウザがどうやってこれを瞬時に鎮圧するか確認してください。</p>
    
    <button id="loopBtn">無限ループテスト開始</button>

    <script>
        document.getElementById('loopBtn').addEventListener('click', () => {
            alert("今から無限ループを開始します。ブラウザの自衛機能に注目してください。");
            
            // 無限ループの開始
            while (true) {
                // 1. アラートを出す
                alert("ループ中...");
                
                // 2. 全画面化を要求（毎回拒否されます）
                document.documentElement.requestFullscreen().catch((err) => {
                    // コンソールにエラーは出ますが、アラートのせいで見る余裕はありません
                    console.log("ブロックされました");
                });
            }
        });
    </script>

</body>
</html>
