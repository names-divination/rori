<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fullscreen Test</title>
<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding:50px;
}
#log{
  margin-top:20px;
  padding:20px;
  background:#eee;
}
</style>
</head>

<body>

<h1>ブラウザ防御テスト</h1>

<button onclick="start()">開始</button>

<div id="log">待機中</div>

<script>

let count = 0;

async function start(){

  document.getElementById("log").innerHTML =
  "開始しました";

  // ユーザー操作中なので1回だけ許可されやすい
  try{
    await document.documentElement.requestFullscreen();

    document.getElementById("log").innerHTML +=
    "<br>全画面成功";
  }
  catch(e){
    document.getElementById("log").innerHTML +=
    "<br>全画面拒否: "+e;
  }


  // alert連打ではなく回数制限で観察
  let timer=setInterval(()=>{

    count++;

    document.getElementById("log").innerHTML =
    "Escで抜けられるか確認中<br>回数:"+count;


    if(count>=10){
      clearInterval(timer);
      document.getElementById("log").innerHTML +=
      "<br>終了";
    }

  },1000);

}

</script>

</body>
</html>
